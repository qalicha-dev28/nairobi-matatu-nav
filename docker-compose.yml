services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: nairobi-postgres
    restart: always
    environment:
      POSTGRES_USER: matatu_user
      POSTGRES_PASSWORD: matatu_pass
      POSTGRES_DB: nairobi_matatu_db
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - nairobi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matatu_user -d nairobi_matatu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nairobi-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only for security
    volumes:
      - redis_data:/data
    networks:
      - nairobi-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  nairobi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16  # Fixed subnet for stable IPs
