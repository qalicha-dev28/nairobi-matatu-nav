services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: nairobi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matatu_user
      POSTGRES_PASSWORD: matatu_pass
      POSTGRES_DB: nairobi_matatu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - nairobi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matatu_user -d nairobi_matatu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nairobi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nairobi-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  nairobi-network:
    driver: bridge
